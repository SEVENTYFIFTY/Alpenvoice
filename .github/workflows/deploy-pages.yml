name: Deploy websites to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [claude/laughing-bardeen-duijft]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Petrus AI at the site root (unchanged URLs), Seventy Fifty at /seventyfifty/
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r petrus-website/. _site/
          mkdir -p _site/seventyfifty
          cp -r seventyfifty-website/. _site/seventyfifty/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
