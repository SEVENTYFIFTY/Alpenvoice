name: Deploy AlpenCoach to GitHub Pages

on:
  push:
    branches:
      - claude/ai-video-personal-trainer-c92bvz
      - main
    paths:
      - 'trainer/**'
      - '.github/workflows/trainer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        working-directory: trainer
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trainer
      - id: deployment
        uses: actions/deploy-pages@v4
